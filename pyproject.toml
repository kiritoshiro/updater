[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wp-site-watch"
version = "0.2.0"
description = "SSH-based WordPress fleet inventory, local dashboard and validated updates"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
site-watch = "sitewatch.__main__:main"
site-collect = "sitewatch.collector:main"

[tool.setuptools.package-data]
sitewatch = ["web/*", "appdb.php"]

[tool.setuptools.packages.find]
include = ["sitewatch*"]
